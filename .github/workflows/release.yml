name: Release

# Tag-driven release. Push tag v<x.y.z> → build on a macOS runner → upload every
# asset to a draft Release → publish it as latest. Installed Hosts need no change:
# their update check already reads
# https://api.github.com/repos/a7garden/ghost/releases/latest, verifies
# ghost-release.json against the baked-in minisign public key, downloads the host
# tarball, waits for idle and installs (apps/ghost-host/src/update/).
#
# Publishing from the Mac (`bun scripts/release.ts --publish`) keeps working: the
# guard skips this workflow whenever a Release for the tag exists, draft or not,
# so a Mac publish that is still uploading its draft is never touched. A draft
# left by a failed run stays until the owner deletes it.
#
# Phone builds are independent: push ios-v<version>-<build> for TestFlight.
on:
  push:
    tags: ["v*", "ios-v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mac-release:
    if: startsWith(github.ref_name, 'v')
    permissions:
      contents: write
    # Same build + checks + signing + publish as the Mac flow
    # (bun scripts/release.ts --publish), minus the iPhone IPA (GHOST_SKIP_IOS=1).
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          # The guard runs before checkout, so it names the repository itself.
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "A Release for $tag already exists (published or uploading from the Mac); skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.exists != 'true'
        with:
          fetch-depth: 0  # release.ts checks the tag's commit is on a pushed branch

      # The release builds Geist from a pinned commit, not from its latest checkout.
      # Use a read-only deploy key for the private repository, not a user token.
      - name: 릴리스 자격 확인
        if: steps.guard.outputs.exists != 'true'
        env:
          GEIST_DEPLOY_KEY: ${{ secrets.GEIST_DEPLOY_KEY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GHOST_UPDATER_KEY: ${{ secrets.GHOST_UPDATER_KEY }}
        run: |
          missing=0
          for name in GEIST_DEPLOY_KEY APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID GHOST_UPDATER_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing release secret: $name"
              missing=1
            fi
          done
          test "$missing" -eq 0
      - uses: actions/checkout@v4
        if: steps.guard.outputs.exists != 'true'
        with:
          repository: a7garden/geist
          ssh-key: ${{ secrets.GEIST_DEPLOY_KEY }}
          persist-credentials: false
          path: geist
          fetch-depth: 0

      - name: geist 미러 사전 확인 (pinned commit 존재 여부)
        if: steps.guard.outputs.exists != 'true'
        run: |
          test -d geist/.git
          git -C geist cat-file -e 'baffff23696b55bf82ad1c6b527e7659a182a4b1^{commit}' || {
            echo "::error::a7garden/geist의 이력에 pinned commit baffff2가 없습니다."
            exit 1
          }

      - uses: oven-sh/setup-bun@v2
        if: steps.guard.outputs.exists != 'true'
        with:
          bun-version: "1.4.2"  # packageManager in package.json

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.exists != 'true'
        with:
          node-version: "24"  # stage-agent-browser.sh requires Node >= 24

      - name: corepack 활성화 (agent-browser 빌드가 pnpm 11.1.3을 요구)
        if: steps.guard.outputs.exists != 'true'
        run: corepack enable

      - uses: dtolnay/rust-toolchain@stable
        if: steps.guard.outputs.exists != 'true'

      - uses: Swatinem/rust-cache@v2
        if: steps.guard.outputs.exists != 'true'

      - name: Developer ID 인증서 임시 키체인에 가져오기
        if: steps.guard.outputs.exists != 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: &import_apple_certificate |
          set -euo pipefail
          umask 077
          cert="$(mktemp "$RUNNER_TEMP/ghost-signing.XXXXXXXX")"
          trap 'rm -f -- "$cert"' EXIT
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$cert"
          keychain="$RUNNER_TEMP/ghost-release.keychain-db"
          keychain_password="$(openssl rand -hex 32)"

          # The macOS security tool can read commands on stdin. Neither the PKCS#12
          # password nor the temporary keychain password belongs in process arguments.
          keychain_command() {
            local arg
            for arg; do
              if [[ "$arg" == *$'\n'* || "$arg" == *$'\r'* ]]; then
                echo "::error::Keychain arguments must be single-line" >&2
                return 1
              fi
              arg=${arg//\\/\\\\}
              arg=${arg//\"/\\\"}
              printf '"%s" ' "$arg"
            done
            printf '\n'
          }
          keychain_command create-keychain -p "$keychain_password" "$keychain" | security -qi
          security list-keychains -d user -s "$keychain"
          security default-keychain -s "$keychain"
          keychain_command unlock-keychain -p "$keychain_password" "$keychain" | security -qi
          security set-keychain-settings -lut 10800 "$keychain"
          keychain_command import "$cert" -k "$keychain" -t agg -f pkcs12 -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign | security -qi
          keychain_command set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" | security -qi
          if ! security find-identity -v -p codesigning "$keychain" | grep -F "\"$APPLE_SIGNING_IDENTITY\"" >/dev/null; then
            echo "::error::The imported Apple signing identity does not match the configured identity"
            exit 1
          fi

      - name: 업데이터 키 준비 (minisign)
        if: steps.guard.outputs.exists != 'true'
        env:
          GHOST_UPDATER_KEY: ${{ secrets.GHOST_UPDATER_KEY }}
        run: |
          umask 077
          mkdir -p ~/.tauri
          printf '%s' "$GHOST_UPDATER_KEY" > ~/.tauri/ghost.key
          chmod 600 ~/.tauri/ghost.key
          # release.ts checks this .pub against tauri.conf.json plugins.updater.pubkey;
          # both come from the same config so the baked-in public key stays consistent.
          jq -r '.plugins.updater.pubkey' apps/ghost-desktop/src-tauri/tauri.conf.json > ~/.tauri/ghost.key.pub

      - name: 의존성 설치
        if: steps.guard.outputs.exists != 'true'
        run: |
          bun install --frozen-lockfile
          for dir in apps/ghost-host apps/ghost-ui apps/ghost-desktop; do
            (
              cd "$dir"
              if [ -f bun.lock ]; then bun install --frozen-lockfile; else bun install; fi
            )
          done

      - name: 빌드·검사·서명·Release 게시 (scripts/release.ts 재사용)
        if: steps.guard.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GHOST_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GEIST_REPO: ${{ github.workspace }}/geist
          GHOST_SKIP_IOS: "1"  # iPhone IPA는 ios-testflight 잡이 담당 (팀 활성화 후)
          GHOST_RELEASE_TAG_PUSHED: "1"  # 이 실행을 시작한 태그가 이미 원격에 있다
          GHOST_UPDATER_KEY_PASSWORD: ${{ secrets.GHOST_UPDATER_KEY_PASSWORD }}
        run: bun scripts/release.ts --publish

      - name: 임시 서명 자격 정리
        if: ${{ always() && steps.guard.outputs.exists != 'true' }}
        run: |
          keychain="$RUNNER_TEMP/ghost-release.keychain-db"
          if [ -f "$keychain" ]; then security delete-keychain "$keychain"; fi
          rm -f -- "$HOME/.tauri/ghost.key" "$HOME/.tauri/ghost.key.pub"

  ios-testflight:
    if: startsWith(github.ref_name, 'ios-v')
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      TEAM_ID: ${{ vars.IOS_TEAM_ID || 'W5SAS95CBV' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: TestFlight 태그·빌드 일치 확인
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          build_tag="$(xcodebuild -project apps/ghost-ios/Ghost.xcodeproj -scheme Ghost \
            -configuration Release -sdk iphoneos -showBuildSettings -json |
            jq -er '.[] | select(.target == "Ghost") | .buildSettings | "ios-v\(.MARKETING_VERSION)-\(.CURRENT_PROJECT_VERSION)"')"
          if [ "$GITHUB_REF_NAME" != "$build_tag" ]; then
            echo "::error::The TestFlight tag must match the Xcode version and build: $build_tag"
            exit 1
          fi

      - name: Apple Distribution 인증서 임시 키체인에 가져오기
        env:
          APPLE_CERTIFICATE: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.IOS_DISTRIBUTION_IDENTITY }}
        run: *import_apple_certificate

      - name: 내부 TestFlight 빌드 서명·검증·업로드
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_KEY_ISSUER: ${{ secrets.ASC_API_KEY_ISSUER }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          IOS_DISTRIBUTION_PROFILE: ${{ secrets.IOS_DISTRIBUTION_PROFILE }}
        run: |
          set -euo pipefail
          for name in ASC_API_KEY_ID ASC_API_KEY_ISSUER ASC_API_KEY_P8 IOS_DISTRIBUTION_PROFILE; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing TestFlight secret: $name"
              exit 1
            fi
          done
          umask 077
          work="$(mktemp -d "$RUNNER_TEMP/ghost-testflight.XXXXXXXX")"
          trap 'rm -rf -- "$work"' EXIT
          export API_PRIVATE_KEYS_DIR="$work"
          key="$work/AuthKey_${ASC_API_KEY_ID}.p8"
          printf '%s' "$ASC_API_KEY_P8" | base64 --decode > "$key"
          unset ASC_API_KEY_P8
          profile="$work/distribution.mobileprovision"
          printf '%s' "$IOS_DISTRIBUTION_PROFILE" | base64 --decode > "$profile"
          unset IOS_DISTRIBUTION_PROFILE
          security cms -D -i "$profile" > "$work/profile.plist"
          profile_id="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$work/profile.plist")"
          test "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$work/profile.plist")" = "$TEAM_ID.io.a7garden.ghost"
          test "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:aps-environment' "$work/profile.plist")" = production
          profile_dir="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$profile_dir"
          cp "$profile" "$profile_dir/$profile_id.mobileprovision"
          auth=(-allowProvisioningUpdates -authenticationKeyPath "$key"
            -authenticationKeyID "$ASC_API_KEY_ID" -authenticationKeyIssuerID "$ASC_API_KEY_ISSUER")
          archive="$work/Ghost.xcarchive"
          xcodebuild -project apps/ghost-ios/Ghost.xcodeproj -scheme Ghost \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$archive" -derivedDataPath "$work/derived" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic "${auth[@]}" archive
          cat > "$work/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict>
              <key>io.a7garden.ghost</key><string>${profile_id}</string>
            </dict>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>testFlightInternalTestingOnly</key><true/>
          </dict></plist>
          PLIST
          plutil -lint "$work/export.plist"
          xcodebuild -exportArchive -archivePath "$archive" -exportOptionsPlist "$work/export.plist" \
            -exportPath "$work/export"

          ipa="$work/export/Ghost.ipa"
          /usr/bin/unzip -q "$ipa" -d "$work/check"
          app="$work/check/Payload/Ghost.app"
          codesign --verify --deep --strict "$app"
          codesign -d --entitlements :- "$app" > "$work/entitlements.plist"
          if [ "$(/usr/libexec/PlistBuddy -c 'Print :aps-environment' "$work/entitlements.plist")" != production ]; then
            echo "::error::The TestFlight IPA must use production APNs"
            exit 1
          fi
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")"
          build="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Info.plist")"
          test "$GITHUB_REF_NAME" = "ios-v$version-$build"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")" = io.a7garden.ghost
          xcrun altool --upload-app -f "$ipa" --type ios --apiKey "$ASC_API_KEY_ID" --apiIssuer "$ASC_API_KEY_ISSUER"
