name: Ghost
options:
  bundleIdPrefix: io.a7garden
  deploymentTarget:
    iOS: '17.0'
packages:
  GhostMobileCore:
    path: .
targets:
  Ghost:
    type: application
    platform: iOS
    sources:
      - path: App
    info:
      path: App/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: io.a7garden.ghost.pair
            CFBundleURLSchemes:
              - ghost
        NSCameraUsageDescription: PC 화면의 QR 코드를 스캔해 서버에 연결할 때 카메라를 사용합니다.
        NSLocalNetworkUsageDescription: 같은 네트워크의 PC Ghost 서버에 연결할 때 로컬 네트워크에 접근합니다.
    dependencies:
      - package: GhostMobileCore
    entitlements:
      path: App/Ghost.entitlements
      properties:
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.a7garden.ghost
        SWIFT_VERSION: '6.0'
        TARGETED_DEVICE_FAMILY: '1,2'
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Ghost
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: '5'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  GhostUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Ghost
    settings:
      base:
        SWIFT_VERSION: '6.0'
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.a7garden.ghost.uitests
        CODE_SIGN_STYLE: Automatic
schemes:
  Ghost:
    build:
      targets:
        Ghost: all
    test:
      targets:
        - GhostUITests
