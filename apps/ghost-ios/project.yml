name: Ghost
options:
  bundleIdPrefix: io.a7garden
  deploymentTarget:
    iOS: '17.0'
packages:
  GhostMobileCore:
    path: .
  WebRTC:
    url: https://github.com/stasel/WebRTC
    from: 134.0.0
targets:
  Ghost:
    type: application
    platform: iOS
    sources:
      - path: App
    info:
      path: App/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: io.a7garden.ghost.connect
            CFBundleURLSchemes:
              - ghost
        NSBonjourServices:
          - _ghost-pair._tcp
    dependencies:
      - package: GhostMobileCore
      - package: WebRTC
    entitlements:
      path: App/Ghost.entitlements
      properties:
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.a7garden.ghost
        SWIFT_VERSION: '6.0'
        TARGETED_DEVICE_FAMILY: '1,2'
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Ghost
        INFOPLIST_KEY_NSCameraUsageDescription: PC 화면의 QR 코드를 스캔해 서버에 연결할 때 카메라를 사용합니다.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: 근처의 Ghost 서버를 자동으로 찾을 때 로컬 네트워크에 연결합니다.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Ghost와 음성으로 대화할 때 마이크를 사용합니다.
        INFOPLIST_KEY_UIBackgroundModes: audio
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: '2'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  GhostUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Ghost
    settings:
      base:
        SWIFT_VERSION: '6.0'
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.a7garden.ghost.uitests
        CODE_SIGN_STYLE: Automatic
schemes:
  Ghost:
    build:
      targets:
        Ghost: all
    test:
      targets:
        - GhostUITests
