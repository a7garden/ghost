[package]
name = "ghost-desktop"
version = "0.1.0"
edition = "2021"

[lib]
name = "ghost_app"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.0", features = [] }

[dependencies]
tauri = { version = "=2.12.0", features = [] }

[target.'cfg(not(target_os = "ios"))'.dependencies]
tauri-plugin-global-shortcut = "=2.3.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSEvent", "NSResponder", "NSWindow", "NSGraphicsContext", "NSWorkspace", "NSOpenPanel", "NSSavePanel", "NSPanel", "NSApplication", "block2"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSURL"] }
block2 = "=0.6.2"
