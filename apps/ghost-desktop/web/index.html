<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ghost</title><style>html{font:15px -apple-system,BlinkMacSystemFont,sans-serif;color-scheme:light dark;background:#f6f5f3;color:#242424}body{display:grid;place-content:center;min-height:90vh;padding:32px}main{width:min(480px,calc(100vw - 64px))}h1{font-size:20px;font-weight:500}p{line-height:1.8;white-space:pre-wrap}#status i{display:block;height:12px;margin:14px 0;border-radius:6px;background:linear-gradient(90deg,#ebeae7,#dedcd8,#ebeae7) 0 0/200% 100%;animation:shimmer 1.4s linear infinite}#status i:nth-child(2){width:78%}#status i:nth-child(3){width:52%}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}@keyframes shimmer{to{background-position:-200% 0}}@media(prefers-color-scheme:dark){html{background:#1b1b1a;color:#eee}#status i{background:linear-gradient(90deg,#252524,#2f2f2d,#252524) 0 0/200% 100%}}@media(prefers-reduced-motion:reduce){#status i{animation:none}}</style><main><h1 id="title">작업 공간을 열고 있습니다</h1><p id="status" role="status"><span class="sr">저장된 대화와 작업을 불러오는 중입니다.</span><i></i><i></i><i></i></p></main></html>
