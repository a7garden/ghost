[package]
name = "ghost"
version = "0.1.0"
edition = "2021"

[features]
default = ["host"]
# Loopback fixture constructor; never enabled in a production artifact.
native-fixtures = []
browser-fixtures = []
browser-local-e2e = ["browser-fixtures"]
browser-handoff-fixtures = ["browser-local-e2e", "dep:libc"]
ui-fixtures = ["browser-handoff-fixtures"]
durable-runtime = ["dep:oxicode-sdk", "oxicode-sdk/durable", "dep:futures"]
# Host is headless by default. Adapters and UI remain independently selectable.
host = ["durable-runtime", "dep:hmac", "dep:base64", "dep:image"]
caldav = ["host", "dep:time", "time/macros", "dep:roxmltree"]
documents = ["host", "dep:oxi-frontmatter", "dep:time", "dep:tempfile", "dep:ammonia", "dep:jotdown", "dep:pulldown-cmark", "dep:base64"]
memory = ["host", "dep:oxibrain-client"]
computer = ["host", "dep:hmac"]
channels = ["host", "dep:tokio-tungstenite", "dep:base64"]
workspace-ui = ["host", "documents", "memory", "computer", "channels"]
oxicode-engine = ["durable-runtime"]

[dependencies]
libc = { version = "0.2", optional = true }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = { version = "0.3", optional = true }
uuid = { version = "1", features = ["v4", "v5", "v7"] }
sha2 = "0.10"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
fs2 = "0.4"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync", "net", "process", "io-util", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart", "stream"] }
oxicode-sdk = { path = "../oxicode/oxicode-sdk", version = "0.81.0", optional = true }
oxi-frontmatter = { path = "../oximemo/crates/oxi-frontmatter", version = "0.4.0", optional = true }
oxibrain-client = { path = "../oxibrain/crates/oxibrain-client", version = "0.21.0", optional = true }
time = { version = "0.3", features = ["formatting", "parsing"], optional = true }
roxmltree = { version = "=0.21.1", optional = true }
tempfile = { version = "3", optional = true }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-webpki-roots"], optional = true }
ammonia = { version = "4", optional = true }
jotdown = { version = "0.9", optional = true }
pulldown-cmark = { version = "0.13", optional = true }
hmac = { version = "0.12", optional = true }
base64 = {version="0.22",optional=true}
image = { version = "0.25.10", default-features = false, features = ["png", "webp"], optional = true }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "ghost"
path = "src/main.rs"

[[bin]]
name = "ghost-browser-fixture"
path = "tests/fixtures/browser_child.rs"
required-features = ["browser-fixtures"]
